name: Fetch EPF India Contacts

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 4 * * 1' # Runs every Monday at 4 AM UTC

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run fetching script
        run: python ./fetch.py # fetch.py exits non-zero (and writes nothing) on a degraded scrape

      - name: Validate data before commit
        # Defense in depth: independently re-check the file fetch.py produced.
        # Fails the job (so nothing is committed) if the data looks degraded.
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open('contacts-data.json'))
          if not isinstance(data, list):
              sys.exit("contacts-data.json is not a list")
          total = len(data)
          errors = sum(1 for r in data if r.get('error'))
          print(f"Validation: {total} entries, {errors} errored")
          if total < 100:
              sys.exit(f"Refusing to commit: only {total} entries (expected ~300+)")
          if total and errors / total > 0.10:
              sys.exit(f"Refusing to commit: {errors}/{total} entries errored (>10%)")
          PY

      - name: Build versioned static API
        run: python ./scripts/build_api.py

      - name: Test static API contract
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add contacts-data.json api/v1
          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update EPF contacts data"
            git push
          fi
