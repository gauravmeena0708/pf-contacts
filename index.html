<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacts Directory — Two-pane Locator (prototype)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="stylesheet" href="tokens.css">
<style>
    .header-wrap { position: relative; flex: 1; max-width: 520px; }
    .near-btn { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); color: #fff; white-space: nowrap; }
    .near-btn:hover { background: rgba(255,255,255,.22); }

    .ac { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: #fff; border: 1px solid var(--line);
          border-radius: var(--radius-sm); box-shadow: var(--shadow); z-index: 1200; max-height: 360px; overflow-y: auto; display: none; }
    .ac div { padding: 9px 14px; cursor: pointer; font-size: 14px; display: flex; gap: 9px; align-items: center; }
    .ac div:hover, .ac div.active { background: var(--teal-50); }
    .ac .ac-body { min-width: 0; }
    .ac .ac-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ac .ac-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ac .who { width: 22px; height: 22px; border-radius: 50%; background: var(--teal-50); color: var(--teal);
               display: grid; place-items: center; font-size: 12px; flex: 0 0 auto; }

    .layout { display: grid; grid-template-columns: 1fr 40%; gap: 0; height: calc(100vh - 58px); }
    .pane-left { overflow-y: auto; padding: 22px 26px; }
    .pane-right { position: relative; border-left: 1px solid var(--line); }
    #map { position: absolute; inset: 0; }

    .hierarchy { margin: 0 0 18px; padding: 0; overflow: hidden; }
    .hierarchy summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 1fr auto;
                         gap: 12px; align-items: center; padding: 13px 16px; }
    .hierarchy summary::-webkit-details-marker { display: none; }
    .hier-summary-copy { min-width: 0; }
    .hier-title { display: block; font-family: 'Space Grotesk', sans-serif; font-weight: 700;
                  font-size: 15px; color: var(--primary-700); }
    .hier-hint { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
    .hier-toggle { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase;
                   letter-spacing: .08em; color: var(--accent-600); border: 1px solid var(--line);
                   border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
    .hier-toggle::before { content: "Expand"; }
    .hierarchy[open] .hier-toggle::before { content: "Collapse"; }
    .hier-body { border-top: 1px solid var(--line); padding: 14px 16px 16px; }
    .hier-path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
    .hier-step { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 9px;
                 background: var(--surface-2); color: var(--ink); }
    a.hier-step:hover { border-color: var(--teal); text-decoration: none; }
    .hier-step.current { background: var(--primary); border-color: var(--primary); color: #fff; }
    .hier-sep { color: var(--faint); font-size: 12px; }
    .hier-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .hier-block { min-width: 0; }
    .hier-block h4 { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase;
                     letter-spacing: .08em; color: var(--faint); margin: 0 0 7px; }
    .hier-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
    .hier-list a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                   border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 9px;
                   color: var(--ink); background: var(--surface); font-size: 13px; }
    .hier-list a:hover { border-color: var(--teal); color: var(--teal); text-decoration: none; }
    .hier-more { color: var(--faint); font-size: 12px; padding: 2px 1px; }
    @media (max-width: 620px) { .hier-grid { grid-template-columns: 1fr; } }

    /* highlight a specific officer arrived at via officer search */
    .offs li.hi { outline: 2px solid var(--accent); background: #FFF7EF; }

    /* "near me" list */
    .nearby-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .nearby-head h2 { font-size: 19px; color: var(--primary-700); }
    .linkish { border: 0; background: transparent; color: var(--teal); cursor: pointer; font-size: 13px; }
    .nearby { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .nearby li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
                 padding: 10px 12px; background: var(--surface); cursor: pointer; }
    .nearby li:hover { border-color: var(--teal); }
    .nearby .nm { flex: 1; min-width: 0; }
    .nearby .dist { color: var(--accent-600); font-size: 13px; white-space: nowrap; }

    .mobile-map-toggle { display: none; }
    @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; height: auto; }
        .pane-right { height: 60vh; border-left: 0; border-top: 1px solid var(--line); display: none; }
        .pane-right.show { display: block; }
        .mobile-map-toggle { display: inline-block; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
                             z-index: 1300; box-shadow: var(--shadow); }
        .appbar { flex-wrap: wrap; }
        .header-wrap { order: 3; max-width: none; flex-basis: 100%; }
    }
</style>
</head>
<body>
<header class="appbar">
    <span class="brand"><span class="seal">₹</span> PF Directory</span>
    <div class="header-wrap">
        <div class="search"><span class="ico">🔍</span><input id="q" type="text" placeholder="Search office, officer, designation or phone…" autocomplete="off"></div>
        <div class="ac" id="ac"></div>
    </div>
    <button class="btn near-btn" id="nearBtn">📍 Near me</button>
    <span class="unofficial">Unofficial</span>
</header>

<div class="layout">
    <section class="pane-left" id="detail"><p class="empty">Loading directory…</p></section>
    <section class="pane-right" id="mapPane"><div id="map"></div></section>
</div>
<button class="btn btn-accent mobile-map-toggle" id="mapToggle">Show map</button>

<script src="common.js"></script>
<script>
let map, cluster, userMarker = null, markersByQuery = {}, index = [], acIndex = -1, defaultQuery = null;
const qEl = document.getElementById('q'), acEl = document.getElementById('ac'), detailEl = document.getElementById('detail');

init();
async function init() {
    try { await EPFO.load(); } catch (e) { detailEl.innerHTML = `<p class="empty">Could not load data: ${EPFO.escapeHtml(e.message)}</p>`; return; }
    buildIndex();
    buildMap();
    const ho = EPFO.all().find(c => /HEAD\+?OFFICE/i.test(c.query || '')) || EPFO.all()[0];
    if (ho) { defaultQuery = ho.query; select(ho.query); }
    wire();
}

// Combined search index: offices AND individual officials.
function buildIndex() {
    EPFO.all().forEach(ct => {
        const name = EPFO.officeName(ct);
        if (name && name.trim() !== '-') {
            index.push({ kind: 'office', label: name, sub: (EPFO.breadcrumbs(ct)[0] || {}).name || '',
                         type: EPFO.officeType(ct).code, query: ct.query, hay: name.toLowerCase() });
        }
        (ct.officials || []).forEach((of, i) => {
            const hay = [of.name, of.designation, (of.phone_numbers || []).join(' '), of.email].filter(Boolean).join(' ').toLowerCase();
            index.push({ kind: 'official', label: of.name || '—', sub: `${of.designation || ''}${of.designation ? ' · ' : ''}${name}`,
                         query: ct.query, officialIndex: i, hay });
        });
    });
}

function buildMap() {
    map = L.map('map', { scrollWheelZoom: true }).setView([22, 79], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 18 }).addTo(map);
    cluster = L.markerClusterGroup({ maxClusterRadius: 45 });
    EPFO.all().forEach(ct => {
        if (!EPFO.hasLatLng(ct)) return;
        const lat = parseFloat(ct.office.latitude), lon = parseFloat(ct.office.longitude);
        if (isNaN(lat) || isNaN(lon)) return;
        const m = L.marker([lat, lon]).bindPopup(`<b>${EPFO.escapeHtml(EPFO.officeName(ct))}</b>`);
        m.on('click', () => select(ct.query));
        markersByQuery[ct.query] = m;
        cluster.addLayer(m);
    });
    map.addLayer(cluster);
}

function select(query, opts = {}) {
    const ct = EPFO.byQuery(query);
    if (!ct) return;
    detailEl.innerHTML = hierarchyHtml(ct) + EPFO.renderDetail(ct);
    detailEl.scrollTop = 0;
    qEl.value = '';
    hideAc();
    if (EPFO.hasLatLng(ct)) {
        const lat = parseFloat(ct.office.latitude), lon = parseFloat(ct.office.longitude);
        map.setView([lat, lon], 11);
        const m = markersByQuery[query];
        if (m) cluster.zoomToShowLayer(m, () => m.openPopup());
    }
    detailEl.querySelectorAll('a[data-q]').forEach(a =>
        a.addEventListener('click', e => { e.preventDefault(); select(a.dataset.q); }));
    if (opts.officialIndex != null) {
        const li = detailEl.querySelectorAll('.offs li')[opts.officialIndex];
        if (li) { li.classList.add('hi'); li.scrollIntoView({ block: 'center' }); }
    }
}

function hierarchyHtml(ct) {
    const b = EPFO.breadcrumbs(ct);
    const parent = EPFO.parentOf(ct);
    const children = EPFO.childrenOf(ct);
    const siblings = EPFO.siblingsOf(ct);
    if (!b.length && !parent && !children.length && !siblings.length) return '';

    const path = b.map(crumb => {
        const linked = EPFO.contactForHierarchyValue(crumb.query_param);
        return { label: crumb.name, query: linked && linked.query !== ct.query ? linked.query : null };
    });
    if (parent && !path.some(item => item.query === parent.query)) {
        path.unshift({ label: EPFO.officeName(parent), query: parent.query });
    }
    path.push({ label: EPFO.officeName(ct), current: true });

    return `<details class="hierarchy card">
        <summary>
            <span class="hier-summary-copy">
                <span class="hier-title">Office hierarchy</span>
                <span class="hier-hint">Expand for parent, nearby / sister offices in this office line.</span>
            </span>
            <span class="hier-toggle" aria-hidden="true"></span>
        </summary>
        <div class="hier-body">
            <div class="hier-path">${path.map((item, i) => {
            const step = item.query
                ? `<a href="#" class="hier-step" data-q="${EPFO.escapeHtml(item.query)}">${EPFO.escapeHtml(item.label)}</a>`
                : `<span class="hier-step${item.current ? ' current' : ''}">${EPFO.escapeHtml(item.label)}</span>`;
            return i === 0 ? step : `<span class="hier-sep">/</span>${step}`;
        }).join('')}</div>
            <div class="hier-grid">
                ${parent ? hierarchyBlock('Parent office', [parent]) : ''}
                ${children.length ? hierarchyBlock('Under this office', children) : ''}
                ${siblings.length ? hierarchyBlock(parent ? 'Nearby / sister offices' : 'Related offices', siblings) : ''}
            </div>
        </div>
    </details>`;
}

function hierarchyBlock(title, offices) {
    const visible = offices.slice(0, 8);
    const remaining = offices.length - visible.length;
    return `<div class="hier-block">
        <h4>${title}</h4>
        <ul class="hier-list">${visible.map(officeLink).join('')}</ul>
        ${remaining > 0 ? `<div class="hier-more">+ ${remaining} more</div>` : ''}
    </div>`;
}

function officeLink(ct) {
    const t = EPFO.officeType(ct);
    return `<li><a href="#" data-q="${EPFO.escapeHtml(ct.query)}">
        <span class="tag tag-${t.code}">${t.code}</span> ${EPFO.escapeHtml(EPFO.officeName(ct))}
    </a></li>`;
}

/* ---------- Search (offices + officials) ---------- */
function wire() {
    qEl.addEventListener('input', () => {
        const term = qEl.value.trim().toLowerCase();
        acIndex = -1;
        if (term.length < 2) return hideAc();
        const hits = index.filter(o => o.hay.includes(term)).slice(0, 12);
        if (!hits.length) return hideAc();
        acEl.innerHTML = hits.map((o, i) => {
            const left = o.kind === 'office'
                ? `<span class="tag tag-${o.type}">${o.type}</span>`
                : `<span class="who">👤</span>`;
            return `<div data-i="${i}"><span style="flex:0 0 auto">${left}</span>
                <span class="ac-body"><span class="ac-name">${EPFO.escapeHtml(o.label)}</span>
                <span class="ac-sub">${EPFO.escapeHtml(o.sub)}</span></span></div>`;
        }).join('');
        acEl.querySelectorAll('div[data-i]').forEach(d =>
            d.addEventListener('click', () => choose(hits[+d.dataset.i])));
        acEl._hits = hits;
        acEl.style.display = 'block';
    });
    qEl.addEventListener('keydown', e => {
        const items = acEl.querySelectorAll('div[data-i]');
        if (acEl.style.display !== 'block' || !items.length) { if (e.key === 'Enter' && acEl._hits) choose(acEl._hits[0]); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = (acIndex + 1) % items.length; paintAc(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = (acIndex - 1 + items.length) % items.length; paintAc(items); }
        else if (e.key === 'Enter') { e.preventDefault(); choose(acEl._hits[acIndex >= 0 ? acIndex : 0]); }
        else if (e.key === 'Escape') hideAc();
    });
    document.addEventListener('click', e => { if (!acEl.contains(e.target) && e.target !== qEl) hideAc(); });
    document.getElementById('nearBtn').addEventListener('click', findNearby);
    document.getElementById('mapToggle').addEventListener('click', () => {
        const pane = document.getElementById('mapPane');
        const shown = pane.classList.toggle('show');
        document.getElementById('mapToggle').textContent = shown ? 'Hide map' : 'Show map';
        if (shown) setTimeout(() => map.invalidateSize(), 50);
    });
}
function choose(hit) { if (hit) select(hit.query, { officialIndex: hit.officialIndex }); }
function paintAc(items) { items.forEach((it, i) => it.classList.toggle('active', i === acIndex)); if (items[acIndex]) items[acIndex].scrollIntoView({ block: 'nearest' }); }
function hideAc() { acEl.style.display = 'none'; acIndex = -1; }

/* ---------- Near me (geolocation) ---------- */
function findNearby() {
    const btn = document.getElementById('nearBtn');
    if (!navigator.geolocation) { detailEl.innerHTML = '<p class="empty">Your browser doesn\'t support location. Use search instead.</p>'; return; }
    btn.textContent = 'Locating…'; btn.disabled = true;
    navigator.geolocation.getCurrentPosition(
        pos => { btn.textContent = '📍 Near me'; btn.disabled = false; showNearby(pos.coords.latitude, pos.coords.longitude); },
        err => { btn.textContent = '📍 Near me'; btn.disabled = false;
                 detailEl.innerHTML = `<p class="empty">Couldn't get your location (${EPFO.escapeHtml(err.message)}). You can still search above.</p>`; },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

function showNearby(ulat, ulon) {
    const ranked = EPFO.all().filter(EPFO.hasLatLng).map(ct => ({
        ct, d: haversineKm(ulat, ulon, +ct.office.latitude, +ct.office.longitude)
    })).sort((a, b) => a.d - b.d).slice(0, 20);

    detailEl.innerHTML = `<div class="nearby-head"><h2>Offices near you</h2>
        <button class="linkish" id="clearNear">← Back</button></div>
        <ul class="nearby">` + ranked.map(({ ct, d }) => {
        const t = EPFO.officeType(ct);
        return `<li data-q="${EPFO.escapeHtml(ct.query)}"><span class="tag tag-${t.code}">${t.code}</span>
            <span class="nm">${EPFO.escapeHtml(EPFO.officeName(ct))}</span>
            <span class="dist mono">${fmtKm(d)}</span></li>`;
    }).join('') + `</ul>`;
    detailEl.scrollTop = 0;
    detailEl.querySelectorAll('.nearby li').forEach(li => li.addEventListener('click', () => select(li.dataset.q)));
    document.getElementById('clearNear').addEventListener('click', () => { if (defaultQuery) select(defaultQuery); });

    // "You are here" + fit to nearest handful
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([ulat, ulon], { radius: 8, color: '#DB7A33', fillColor: '#DB7A33', fillOpacity: .9, weight: 2 })
        .bindPopup('You are here').addTo(map);
    const pts = ranked.slice(0, 8).map(x => [+x.ct.office.latitude, +x.ct.office.longitude]);
    pts.push([ulat, ulon]);
    setTimeout(() => map.invalidateSize(), 30);
    map.fitBounds(pts, { padding: [40, 40] });
}

function haversineKm(la1, lo1, la2, lo2) {
    const R = 6371, toR = d => d * Math.PI / 180;
    const dLa = toR(la2 - la1), dLo = toR(lo2 - lo1);
    const a = Math.sin(dLa / 2) ** 2 + Math.cos(toR(la1)) * Math.cos(toR(la2)) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
}
function fmtKm(d) { return d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(d < 10 ? 1 : 0)} km`; }
</script>
</body>
</html>
